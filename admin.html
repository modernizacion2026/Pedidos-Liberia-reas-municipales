<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: #555;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .form-group input:valid {
            border-color: #28a745;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 18px;
            user-select: none;
        }

        .password-toggle:hover {
            color: #333;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #5a6fd8;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e1e5e9;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 18px;
        }

        .form-group.with-icon input {
            padding-left: 45px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Bienvenido</h1>
            <p>Inicia sesión en tu cuenta</p>
        </div>

        <div class="success-message" id="successMessage">
            ¡Inicio de sesión exitoso! Redirigiendo...
        </div>

        <form id="loginForm">
            <div class="form-group with-icon">
                <label for="email">Correo Electrónico</label>
                <span class="input-icon">📧</span>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    placeholder="tu@email.com"
                    autocomplete="email"
                >
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group with-icon">
                <label for="password">Contraseña</label>
                <span class="input-icon">🔒</span>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    minlength="6"
                >
                <span class="password-toggle" onclick="togglePassword()">👁️</span>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    Recordarme
                </label>
                <a href="#" class="forgot-password" onclick="showForgotPassword()">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Iniciar Sesión
            </button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta? <a href="#" onclick="showRegister()">Regístrate aquí</a>
        </div>
    </div>

    <script>
        // Variables globales
        let isLoading = false;
        
        // Datos de usuario demo (en una aplicación real, esto vendría del servidor)
        const demoUsers = {
            'demo@email.com': 'password123',
            'usuario@test.com': '123456'
        };

        // Función para alternar visibilidad de contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        // Función para validar email
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Función para mostrar errores
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        // Función para ocultar errores
        function hideError(elementId) {
            const errorElement = document.getElementById(elementId);
            errorElement.style.display = 'none';
        }

        // Función para mostrar mensaje de éxito
        function showSuccess() {
            const successElement = document.getElementById('successMessage');
            successElement.style.display = 'block';
            
            // Simular redirección después de 2 segundos
            setTimeout(() => {
                alert('En una aplicación real, serías redirigido al dashboard');
                successElement.style.display = 'none';
                document.getElementById('loginForm').reset();
            }, 2000);
        }

        // Función para simular carga
        function setLoading(loading) {
            const loginBtn = document.getElementById('loginBtn');
            isLoading = loading;
            
            if (loading) {
                loginBtn.classList.add('loading');
                loginBtn.textContent = '';
            } else {
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Iniciar Sesión';
            }
        }

        // Event listener para el formulario
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isLoading) return;

            // Limpiar errores previos
            hideError('emailError');
            hideError('passwordError');

            // Obtener valores
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            let hasErrors = false;

            // Validar email
            if (!email) {
                showError('emailError', 'El correo electrónico es requerido');
                hasErrors = true;
            } else if (!validateEmail(email)) {
                showError('emailError', 'Ingresa un correo electrónico válido');
                hasErrors = true;
            }

            // Validar contraseña
            if (!password) {
                showError('passwordError', 'La contraseña es requerida');
                hasErrors = true;
            } else if (password.length < 6) {
                showError('passwordError', 'La contraseña debe tener al menos 6 caracteres');
                hasErrors = true;
            }

            if (hasErrors) return;

            // Simular proceso de login
            setLoading(true);

            setTimeout(() => {
                // Verificar credenciales demo
                if (demoUsers[email] && demoUsers[email] === password) {
                    setLoading(false);
                    showSuccess();
                    
                    // Guardar preferencia de recordar (en una app real usarías cookies seguras)
                    if (rememberMe) {
                        console.log('Usuario eligió ser recordado');
                    }
                } else {
                    setLoading(false);
                    showError('passwordError', 'Credenciales incorrectas. Intenta con demo@email.com / password123');
                }
            }, 1500);
        });

        // Validación en tiempo real
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value.trim();
            if (email && !validateEmail(email)) {
                showError('emailError', 'Ingresa un correo electrónico válido');
            } else {
                hideError('emailError');
            }
        });

        // Función para mostrar formulario de recuperación de contraseña
        function showForgotPassword() {
            alert('Funcionalidad de recuperación de contraseña.\nEn una aplicación real, esto abriría un formulario o enviaría un email.');
        }

        // Función para mostrar formulario de registro
        function showRegister() {
            alert('Funcionalidad de registro.\nEn una aplicación real, esto redirigiría a la página de registro.');
        }

        // Efecto de entrada suave
        window.addEventListener('load', function() {
            document.querySelector('.login-container').style.animation = 'slideIn 0.5s ease-out';
        });

        // Agregar animación CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
